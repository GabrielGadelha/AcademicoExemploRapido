spring.application.name=academicoExemploDidativo
# Porta dinâmica exigida por plataformas de nuvem (Render, Railway, Fly.io)
server.port=${PORT:8080}

# Banco H2 em memória (zero configuração externa para deploy imediato)
spring.datasource.url=jdbc:h2:mem:academicodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update